<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="redBase" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#d91b20"/>
      <stop offset="55%" stop-color="#bd0006"/>
      <stop offset="100%" stop-color="#970006"/>
    </radialGradient>

    <clipPath id="circleClip">
