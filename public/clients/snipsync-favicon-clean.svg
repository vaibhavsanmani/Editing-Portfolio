    <ellipse cx="390" cy="150" rx="125" ry="210" fill="#f33d42" transform="rotate(-20 390 150)"/>
    <ellipse cx="155" cy="455" rx="150" ry="90" fill="#ef4b50" transform="rotate(20 155 455)"/>
    <ellipse cx="425" cy="370" rx="150" ry="90" fill="#f34b50" transform="rotate(-25 425 370)"/>
  </g>

  <g clip-path="url(#circleClip)" fill="#ff4c52" opacity="0.13">
    <path d="M0 335 C80 280 130 330 155 390 C185 460 120 510 0 512Z"/>
    <path d="M315 0 C350 85 440 75 512 20 L512 180 C450 190 375 145 315 0Z"/>
